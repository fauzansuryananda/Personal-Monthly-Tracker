<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Monthly Budget Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230a4aa8'/><text x='50' y='67' font-size='50' font-weight='700' text-anchor='middle' fill='white' font-family='Arial'>Rp</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-view="dash">
<nav class="rail">
  <div class="rt">
    <button data-view="dash" class="on" title="Dashboard"><svg viewBox="0 0 24 24"><path d="M3 3h8v8H3zM13 3h8v5h-8zM13 10h8v11h-8zM3 13h8v8H3z"/></svg></button>
    <button data-view="data" title="Data"><svg viewBox="0 0 24 24"><path d="M2 6a2 2 0 0 1 2-2h5l2 2h9a2 2 0 0 1 2 2v1H6l-4 9zM6 11h17l-3.5 9H3z"/></svg></button>
  </div>
  <button id="addBtn" title="Tambah data"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 7.5v9M7.5 12h9" stroke-linecap="round"/></svg></button>
</nav>

<main class="layout">
  <div class="hi dash">Hi, Atreus</div>
  <h1 class="ttl dash">Monthly Budget Tracker</h1>

  <section class="hello">
    <b>Hello!<br><span id="user"></span></b>
    <img src="images/avatar.png" alt="">
  </section>

  <section class="bal">
    <div class="seg"><span><i class="flag"></i>IDR</span></div>
    <div class="lbl">Active Balance <small id="status"></small></div>
    <div class="big"><span id="bal"></span><button class="eye" id="eye" title="Tampilkan/sembunyikan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <div class="bsub"><span>&uarr; Income <b class="g" id="bin"></b></span><span>&darr; Outcome <b class="neg" id="bout"></b></span></div>
    <div class="btns"><button class="btn dark" id="addBtn2">&#9096; Add Data</button><button class="btn" id="refresh">&#8635; Refresh</button><span class="more">&middot;&middot;&middot;</span></div>
  </section>

  <section class="cal dash">
    <div class="cl">
      <div class="mn">&#9776;</div>
      <div class="n" id="dn"></div><div class="dw" id="dw"></div>
      <div class="ev"><b>Current Events</b><div id="evs"></div><div class="dtot" id="dtot"></div><a id="past">See past events</a>
        <button class="ce" id="addBtn3">Add Data <span>&oplus;</span></button></div>
    </div>
    <div class="cr">
      <div class="yr"><button id="py">&#9666;</button><span id="yr"></span><button id="ny">&#9656;</button></div>
      <div class="mr" id="mr"></div><div class="cm" id="cm"></div>
    </div>
  </section>

  <section class="spend">
    <div class="sh"><span class="ic"><svg viewBox="0 0 24 24"><path d="M6 8h12l1 12H5zM9 8a3 3 0 0 1 6 0"/></svg></span>Spending<span class="pill" id="sm"></span></div>
    <div class="donut"><svg viewBox="0 0 180 180" id="dsvg"></svg><div class="dc"><b id="stot"></b><span class="neg" id="sdelta"></span></div></div>
    <div class="ins" id="ins"></div>
    <div class="sl" id="sl"></div>
  </section>

  <section class="earn dash">
    <div class="sh"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 7h14a2 2 0 0 1 2 2v9H6a2 2 0 0 1-2-2zM4 7l12-3v3M15 13h3"/></svg></span>Earning<span class="tgt"><span id="tgt"></span><i><u id="tbar"></u></i></span></div>
    <div class="big2" id="etot"></div>
    <div class="blue" id="esub"></div>
    <div id="ebars"></div>
  </section>

  <section class="txc dash">
    <div class="sh"><span class="ic"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M9 9h6M9 13h6"/></svg></span>Transactions<span class="pill" id="rd"></span></div>
    <div id="rec"></div>
  </section>

  <section class="sum data">
    <div><h3>Income</h3><small id="sper"></small><b class="g" id="tin"></b></div>
    <div><h3>Expenses</h3><small id="sper2"></small><b class="rd" id="tout"></b></div>
  </section>
  <section class="leg data" id="leg"></section>

  <section class="tblc data">
    <div class="tools"><input id="q" placeholder="Cari transaksi..."><select id="ty"><option value="">Semua</option><option>Income</option><option>Outcome</option></select></div>
    <div class="tw"><table>
      <thead><tr><th>Date</th><th>Category</th><th>Description</th><th class="r">Amount</th><th>Type</th><th>Notes</th></tr></thead>
      <tbody id="tb"></tbody>
    </table></div>
  </section>
</main>

<div class="modal" id="modal" hidden>
  <form class="sheet" id="form" autocomplete="off">
    <div class="sh">Tambah Transaksi <button type="button" class="x" id="close">&times;</button></div>
    <label>Date<input type="date" name="date" required></label>
    <label>Category<input name="category" list="cats" required placeholder="Food, Rent, Salary..."></label>
    <label>Description<input name="description" required></label>
    <label>Amount (IDR)<input type="number" name="amount" min="1" step="any" required inputmode="numeric"></label>
    <label>Type<select name="type"><option>Outcome</option><option>Income</option></select></label>
    <label>Notes<input name="notes"></label>
    <datalist id="cats"><option>Food<option>E-Commerce<option>Shopping<option>Rent<option>Transport<option>Family<option>Health<option>Internet<option>Entertainment<option>Training<option>Salary<option>Project<option>Others</datalist>
    <button class="btn dark full" id="save" type="submit">Simpan ke Spreadsheet</button>
  </form>
</div>
<div class="toast" id="toast" hidden></div>
<script src="script.js"></script>
</body>
</html>
